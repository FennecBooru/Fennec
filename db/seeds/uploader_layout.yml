- kind: tags
  key: content
  label: Contentious Content
  hint: >-
    Fetishes or subjects that other users may find extreme or objectionable. These allow users to find or blacklist
    content with ease. Make sure that you are tagging these upon initial upload.
  placeholder: cub scatplay watersports diaper my_little_pony vore rape hyper etc.
  buttons:
    - { name: Cub }
    - { name: Baby, shown_when: [cub] }
    - { name: Toddler, shown_when: [cub] }
    - { name: Child, shown_when: [cub] }
    - { name: Teenager, shown_when: [cub] }
    - { name: Male Cub, tag: male_cub, row: 2, shown_when: [cub, male], shown_when_mode: all }
    - { name: Female Cub, tag: female_cub, row: 2, shown_when: [cub, female], shown_when_mode: all }
    - { name: Andromorph Cub, tag: andromorph_cub, row: 2, shown_when: [cub, andromorph], shown_when_mode: all }
    - { name: Gynomorph Cub, tag: gynomorph_cub, row: 2, shown_when: [cub, gynomorph], shown_when_mode: all }
    - { name: Hermaphrodite Cub, tag: herm_cub, row: 2, shown_when: [cub, herm], shown_when_mode: all }
    - { name: Male-Herm Cub, tag: maleherm_cub, row: 2, shown_when: [cub, maleherm], shown_when_mode: all }
    - { name: Unknown Cub, tag: unknown_cub, row: 2, shown_when: [cub, unknown_gender], shown_when_mode: all }
    - { name: Anthro Cub, tag: anthro_cub, row: 2, shown_when: [cub, anthro], shown_when_mode: all }
    - { name: Feral Cub, tag: feral_cub, row: 2, shown_when: [cub, feral], shown_when_mode: all }
    - { name: Taur Cub, tag: taur_cub, row: 2, shown_when: [cub, taur], shown_when_mode: all }
- kind: rating
  label: Rating
  hint: 'Explicit tags include sex, pussy, penis, masturbation, fellatio, etc. ("help":/help/ratings)'
  show_in_compact_mode: true
- kind: other_tags
  label: Other Tags
  hint: |-
    Separate tags with spaces. ("help":/help/tags)

    Ensure you've reviewed our [[tag_what_you_see|Tag What You See]] policy.
  show_in_compact_mode: true
- kind: parent
  label: Parent Post ID
  placeholder: "12345"
  show_in_compact_mode: true
- kind: locked_tags
  label: Locked Tags
  show_in_compact_mode: true
- kind: lock_rating
  label: Lock Rating
  show_in_compact_mode: true
- kind: description
  label: Description
  show_in_compact_mode: true
- kind: upload_options
  label: Upload Options
  show_in_compact_mode: true
